<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="usuarios.css">
    <title>Usuarios</title>
</head>

<body>
    <header class="header">
        <div class="container header-content">
            <h1 class="logo">Usuarios</h1>

            <nav class="nav">
                <a href="../../index.html" class="active">Voltar para Home</a>
            </nav>
        </div>
    </header>

    <section class="features">
        <div class="container section-content">
            <h2> Adicionar novos usuarios</h2>


            <div class="cards-user">
                <article class="card-user">
                    <h3>Cadastar usuário</h3>
                    <div class="conteudo_user">
                        <label for="nome">Nome: </label>
                        <input type="text" id="nome" placeholder="Digite seu nome"> <br>

                        <label for="email">E-mail:</label>
                        <input type="email" id="senha" placeholder="Digite seu email"><br>
                        <div class="hero-actions">
                            <a href="#" class="button primary">Adicionar novo usuario</a>
                        </div>
                    </div>
                </article>
                <article class="card-user cadastro">
                    <h3>Usuarios cadastrados</h3>
                    <div class="conteudo_user">
                       <p>Ana     ana@email.com</p>
                       <p>Carlos  carlos@email.com</p>
                       <p>Marina  marina@email.com</p>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </section>


</body>

</html>
